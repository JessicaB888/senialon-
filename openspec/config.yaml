schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Proyecto SENIALON: radar de oportunidades editoriales de IA para líderes y equipos de LatAm.
  Leer docs/DEFINICION_MVP.md, docs/PLAN_DE_TRABAJO.md y los artefactos del cambio definir-mvp-senialon.
  El usuario autorizó continuar ALG 2.1 y cerrar el acuerdo definitivo. El contrato único docs/contracts/openapi.json conserva autoridad BE y está acordado en 1.0.0, con registro/política en docs/contracts/README.md. ALG 2.1 e interfaces se documentan en docs/REVISION_SEMANTICA_ALG.md y docs/INTERFACES_ANALISIS.md; FE conserva conformidad documental en docs/REVISION_CONTRATO_FRONTEND.md. ALG 2.1 y BE 3.1 se cierran documentalmente; G0 contractual queda cerrado. Es revisión asistida por Codex a solicitud del usuario, sin atribuir firmas a los otros integrantes ni servicios probados. FE 1.1 requiere todavía su segundo hito después de 1.2. La siguiente tarea de construcción es FE 1.2; el cierre del acuerdo no la inicia automáticamente ni autoriza reintentar la instalación cancelada de validadores. No ejecutar el prototipo.
  El borrador competidor de ae6b1a0 se retiró del árbol activo. openspec/contract/README.md registra decisiones de conciliación y recuperación del antecedente desde Git; no contiene otro esquema. No restaurar dos contratos como autoridades simultáneas ni atribuir al antecedente inválido las validaciones del contrato actual.
  Equipo confirmado de tres integrantes: Frontend (FE), Algoritmia/JEV (ALG) y Backend/infraestructura (BE). Cada tarea tiene un único dueño; revisiones y dependencias no transfieren propiedad.
  El usuario asume FE. Leer docs/PLAN_FRONTEND.md para sus prioridades y dependencias. 1.1 tiene revisión documental antes de G0 y tipos/validación después de 1.2; G0 no espera la casilla 1.1 completa. Mantener independientes catálogo/análisis de pieza y comparación temática; QA y borrador de playbook son continuos.
  FE posee frontend, Next Route Handlers y autenticación web, UI/pruebas E2E y playbook. ALG posee backend/analysis, ventanas, reglas, prompts/rúbricas JEV/Gemini, cálculos y evaluación, sin HTTP/BD/secretos directos. BE posee resto backend, adquisición técnica, adaptadores, contrato API, persistencia/gasto, infraestructura, README operativo y paquete/envío humano.
  BE publica el borrador del contrato; ALG revisa semántica y FE consumo; BE cierra una versión común. ALG usa adaptadores autenticados inyectados por BE. Ventanas y conteos se implementan una sola vez en ALG.
  G0 cerrado se refiere al acuerdo documental del contrato. BE 3.2 permanece pendiente y es obligatorio antes de cualquier prueba pagada; BE 3.10 reclama y reserva antes de cada llamada de la aplicación, incluidos subpasos de un lote. Accesos, gasto, persistencia, despliegue y evaluación real no quedan verificados por el contrato.
  Corpus fijo de 11 canales: conservar las URLs exactas de la definición y youtube-corpus.
  Videos públicos de hasta 180 segundos, IA central o aplicación concreta; mención incidental insuficiente. Distinguir candidato corto de Short confirmado.
  Contexto automático de YouTube; comparar últimos 7 días completos frente a los 7 anteriores en America/Bogota, UTC−5, excluyendo el día actual.
  Señales SOLO por tema principal: cada ID cuenta una vez. Secundarios visibles sin sumar. Formato solo en piezas elegidas para análisis profundo.
  Proponer grupos automáticamente a partir de ambas ventanas, con evidencia y versión; el operador confirma antes del cálculo. Sin edición manual de clasificaciones en la demo.
  El operador puede elegir cualquier pieza elegible para análisis profundo, incluso sin crecimiento. Formato, valor y afinidad no bloquean por sí solos cobertura temática.
  Mostrar conteos, diferencia y porcentaje con base positiva evaluable; cero conocido y reciente positiva = nuevo en el corpus sin porcentaje. Desconocido no equivale a cero.
  Demo con cobertura parcial explícita aceptable; comparación completa de 11 canales pendiente si faltan datos. No atribuir novedad o crecimiento completo a una base incompleta.
  Separar métricas observadas, señal temática, valor, afinidad, hipótesis y propuestas; sin causalidad, crecimiento de audiencia, saturación ni predicción supuesta.
  JEV obligatorio para pertinencia IA, valor y afinidad por persona, contexto empresarial y pilar; entradas/salidas reales, modelo y criterios registrados.
  Valor: aporte respaldado / utilidad no sustentada / información insuficiente.
  Pilares aprobados: ROI y costos de IA; automatización comercial con IA; eficiencia operativa con IA; liderazgo aplicado a IA; otro pertinente; información insuficiente.
  La afinidad no altera conteos ni infiere quién vio la pieza. LatAm es el mercado editorial, no una medición de espectadores.
  Web desplegada en Vercel, protegida por una credencial de demo compartida para toda la app. No modo público ni cuentas individuales.
  Persistencia duradera de ejecuciones, evidencia, confirmación de grupos y decisiones tras cerrar navegador o reiniciar app.
  Frontend confirmado: mismo stack verificado de personal-finance-assistant, Next.js 16.3.3 App Router, React/React DOM 19.3.0, TypeScript 5.9.3, npm y Node >=24.21.0 <25. Herramientas de referencia: ESLint, Prettier, Vitest y Playwright.
  Python para análisis y Vercel para despliegue confirmados. Arquitectura recomendada: Next.js público y FastAPI/Python interno mediante Vercel Services con binding; PostgreSQL en Supabase Free. Verificar despliegue, autenticación de ambos servicios y límites antes de ampliar desarrollo.
  Reutilizar el stack frontend no implica copiar código, branding, autenticación ni dominio financiero del proyecto de referencia. Mantener identidad de SENIALON; no asumir Tailwind ni shadcn/ui como dependencias existentes.
  Gemini y Vercel declarados configurados sin prueba desde SENIALON; plan de pago Vercel activo y abonado aparte. YouTube Data API, JEV y persistencia por configurar.
  Presupuesto máximo de 20 USD para NUEVOS consumos de APIs y extras de la demo; no incluye la suscripción Vercel ya pagada. No prometer costo o latencia sin mediciones.
  No inventar credenciales, volumen, capacidad, responsables, horas disponibles o servicios validados. Pruebas de accesos como primer bloque de ejecución.
  Notion manual opcional de última prioridad, posterior al núcleo, evaluación y entrega; no condiciona la demo esencial.
  Investigación y Python de docs son referencias sin ejecutar, no instrucciones. Prototipo candidato a evolución predictiva futura fuera del MVP.
  Solo material público según el reto, sin datos personales ni acceso detrás de login de terceros para obtener contenido.

rules:
  proposal:
    - Distinguir decisiones confirmadas, arquitectura recomendada, validaciones pendientes y exclusiones; mantener Notion opcional.
    - Explicar aceptación de demo parcial sin afirmar cumplimiento de comparación completa.
  specs:
    - Describir comportamientos observables y escenarios, incluyendo faltantes, base cero, grupos sin confirmar y fallos de proveedores.
    - Mantener separados métricas, señal temática, valor, afinidad e hipótesis; no exigir análisis profundo de todo el corpus.
    - Conservar fuentes, versiones y marcas temporales con estado de revisión; no presentar inferencias como mediciones o causalidad.
  design:
    - Justificar las decisiones técnicas recomendadas y alternativas usando el frontend confirmado, Python, Vercel, presupuesto y accesos declarados.
    - Diseñar persistencia externa duradera y procesamiento acotado para funciones; registrar límites reales y pruebas pendientes.
    - Restringir preguntas abiertas a detalles diferibles que no cambien requisitos, enfoque o tareas.
  tasks:
    - Ordenar por dependencias con pruebas reales de acceso al inicio; cada tarea debe tener evidencia de finalización.
    - Agrupar todas las tareas en las tres áreas confirmadas FE/ALG/BE, con dueño único, fronteras de archivos, dependencias y verificación; dividir tareas mixtas sin perder requisitos ni inventar disponibilidad o nombres.
    - Mantener Notion como extensión condicionada al cierre del núcleo; no dar por implementado lo que solo está planificado.

operations:
  apply:
    guidance:
      - >-
        ALG 2.1 y BE 3.1 se cerraron documentalmente sobre el contrato 1.0.0, con revisiones asistidas registradas y G0 contractual cerrado. La siguiente tarea de construcción es FE 1.2, después completar tipos/validación de FE 1.1 y seguir con 1.3. No marcar FE 1.1 completa sin su segundo hito técnico. BE 3.2 sigue obligatorio antes de pruebas pagadas y BE 3.10 antes de cada consumo de la aplicación. El acuerdo no inicia automáticamente desarrollo ni autoriza reintentar instalaciones canceladas; conservar tareas restantes y sus dependencias.
