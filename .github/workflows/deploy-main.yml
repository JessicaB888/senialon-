name: SENIALON · comprobaciones

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Solo comprobaciones: Vercel despliega main mediante su integración Git.
concurrency:
  group: senialon-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Comprobar frontend y Python
    if: github.repository == 'albcamargo/senialon-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener el commit solicitado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node de SENIALON
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar frontend sin credenciales reales
        working-directory: frontend
        run: |
          npm ci
          npm run contract:check
          npm test
          npm run test:types
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
          npm run security:client

      - name: Preparar uv y Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: false

      - name: Verificar backend y análisis sin proveedores
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked python -B -m pytest -q tests analysis/tests
